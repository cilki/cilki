[package]
authors = ["cilki"]
description = "Contains imagery and digital provenance for all cilki projects"
edition = "2021"
license = "Unlicense"
name = "cilki"
version = "0.1.2"

[dependencies]
clap = { version = "4.4.8", features = ["derive"] }
pgp = { version = "0.11.0", optional = true }
quick-xml = { version = "0.31.0", features = ["serialize"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
resvg = { version = "0.45.0", optional = true }
usvg = { version = "0.45.0", optional = true }

[features]
# Verify artifact signatures
verify = ["dep:pgp"]

# Generate graphics via the build-graphics subcommand
build-graphics = ["dep:quick-xml", "dep:serde", "dep:resvg", "dep:usvg"]

# Each project can be enabled individually
project-attest = []
project-cibox = []
project-codemine = []
project-fossdb = []
project-goldboot = []
project-outpost = []
project-sandpolis = []
project-solder = []
project-turbine = []
project-workset = []
