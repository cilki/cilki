<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="50"
   height="50"
   viewBox="0 0 50 50"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <g id="layer1">

    <!-- Torch on a 45° axis: orifice tip, flared nozzle, neck, collar and handle -->
    <path
       id="tip"
       style="fill:none;stroke:#000000;stroke-width:2.6;stroke-linecap:round"
       d="M 10,40 L 12.8,37.2" />
    <path
       id="nozzle"
       style="fill:none;stroke:#000000;stroke-width:4.6;stroke-linecap:round"
       d="M 13.6,36.4 L 15.7,34.3" />
    <path
       id="neck"
       style="fill:none;stroke:#000000;stroke-width:2.8;stroke-linecap:round"
       d="M 15.7,34.3 L 23.4,26.6" />
    <path
       id="collar"
       style="fill:none;stroke:#000000;stroke-width:5.0;stroke-linecap:round"
       d="M 23.4,26.6 L 25.2,24.8" />
    <path
       id="handle"
       style="fill:none;stroke:#000000;stroke-width:6.4;stroke-linecap:round"
       d="M 25.6,24.4 L 38.3,11.7" />

    <!-- Valve knob rising off the handle -->
    <path
       id="valve-stem"
       style="fill:none;stroke:#000000;stroke-width:2.2;stroke-linecap:round"
       d="M 33.4,12.4 L 30.9,9.9" />
    <path
       id="valve-knob"
       style="fill:none;stroke:#000000;stroke-width:2.6;stroke-linecap:round"
       d="M 29.1,11.7 L 32.7,8.1" />

    <!-- Gas hose trailing off the back -->
    <path
       id="hose"
       style="fill:none;stroke:#000000;stroke-width:2.0;stroke-linecap:round"
       d="M 40,10 C 43.5,6.5 46.5,5 48,7" />

    <!-- Sparks at the tip -->
    <path
       id="spark1"
       style="fill:none;stroke:#000000;stroke-width:1.8;stroke-linecap:round"
       d="M 7.5,42.5 L 5,45" />
    <path
       id="spark2"
       style="fill:none;stroke:#000000;stroke-width:1.8;stroke-linecap:round"
       d="M 6.8,39.2 L 3.8,38.8" />
    <path
       id="spark3"
       style="fill:none;stroke:#000000;stroke-width:1.8;stroke-linecap:round"
       d="M 10.8,43.2 L 11.2,46.2" />
  </g>
</svg>
