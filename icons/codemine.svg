<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="50"
   height="50"
   viewBox="0 0 50 50"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <g id="layer1">
    <!-- Authored upright; the group transform tilts it into a digging pose. -->
    <g id="shovel" transform="translate(2.596,4.414) scale(0.8598) rotate(45,25,25)">

      <!-- Grip, shaft and collar -->
      <path
         id="grip"
         style="fill:none;stroke:#000000;stroke-width:4.2;stroke-linecap:round"
         d="M 18,-6 H 32" />
      <path
         id="shaft"
         style="fill:none;stroke:#000000;stroke-width:4.8;stroke-linecap:round"
         d="M 25,-6 V 21" />
      <path
         id="collar"
         style="fill:#000000"
         d="M 22,24.5 L 28,24.5 L 26.5,19 L 23.5,19 Z" />

      <!-- Blade, doubling as a keyboard -->
      <rect
         id="blade"
         style="fill:none;stroke:#000000;stroke-width:2.8;stroke-linejoin:round"
         x="11.0" y="24.0" width="28.0" height="23.0" rx="1.5" />

      <!-- Keys: 3 rows of 5, then a spacebar row -->
        <rect id="key-r1c1" style="fill:#000000" x="14.4" y="27.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r1c2" style="fill:#000000" x="18.9" y="27.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r1c3" style="fill:#000000" x="23.4" y="27.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r1c4" style="fill:#000000" x="27.9" y="27.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r1c5" style="fill:#000000" x="32.4" y="27.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r2c1" style="fill:#000000" x="14.4" y="31.6" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r2c2" style="fill:#000000" x="18.9" y="31.6" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r2c3" style="fill:#000000" x="23.4" y="31.6" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r2c4" style="fill:#000000" x="27.9" y="31.6" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r2c5" style="fill:#000000" x="32.4" y="31.6" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r3c1" style="fill:#000000" x="14.4" y="36.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r3c2" style="fill:#000000" x="18.9" y="36.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r3c3" style="fill:#000000" x="23.4" y="36.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r3c4" style="fill:#000000" x="27.9" y="36.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r3c5" style="fill:#000000" x="32.4" y="36.1" width="3.3" height="3.3" rx="0.6" />
        <rect id="key-r4c1" style="fill:#000000" x="14.4" y="40.6" width="3.3" height="3.3" rx="0.6" />
        <rect id="spacebar" style="fill:#000000" x="18.9" y="40.6" width="12.3" height="3.3" rx="0.6" />
        <rect id="key-r4c5" style="fill:#000000" x="32.4" y="40.6" width="3.3" height="3.3" rx="0.6" />
    </g>
  </g>
</svg>
